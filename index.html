// ===== CAGED（画面） =====
let cagedMark;

function cagedSeq(win, set){
  return windowSequence(win[0], win[1], ROOT, set);
}
function cagedLabel(info, role){
  if (state.label === 'degree') return role || (info.inScale ? info.inScale.degree : '');
  if (state.label === 'doremi') return info.inScale ? info.inScale.doremi : '';
  return info.inScale ? info.inScale.name : '';
}
function strum(p){
  ensureAudio();
  const t = audio.ctx.currentTime + 0.02;
  [...p.notes].sort((a,b) => b.s - a.s).forEach((n, i) => pluck(n.midi, t + i*0.035, { gain:0.7 }));
  cagedFlash(p.notes);
}
function cagedFlash(list){
  if (!cagedMark) return;
  cagedMark.innerHTML = '';
  list.forEach(m => el('circle', {class:'ring', cx:noteX(m.f), cy:strY(m.s), r:15}, cagedMark));
}

function renderCagedBoard(svg, placements){
  const g = drawWood(svg);
  const major = buildScale(ROOT, 'major');
  const overlaySet = state.cagedOverlay === 'major' ? major
    : state.cagedOverlay === 'pent' ? buildScale(ROOT, 'majorPent') : null;
  const sel = state.cagedShape === 'all' ? placements : placements.filter(p => p.shape === state.cagedShape);
  // 形の領域
  sel.forEach(p => {
    const c = CAGED_SHAPES[p.shape].color;
    const x1 = p.lo === 0 ? X0 - 44 : fretX(p.lo - 1), x2 = fretX(Math.max(p.hi, 1));
    el('rect', {x:x1+2, y:TOP-20, width:x2-x1-4, height:5*SP+40, fill:c, opacity:.13, rx:6}, g);
    el('rect', {x:x1+2, y:TOP-20, width:x2-x1-4, height:5*SP+40, fill:'none', stroke:c, 'stroke-opacity':.7, rx:6}, g);
    const t = el('text', {x:(x1+x2)/2, y:TOP-24, 'text-anchor':'middle', 'font-size':13, 'font-weight':700, fill:c}, g);
    t.textContent = p.shape + '形';
  });
  const notesG = el('g', {}, svg);
  // スケールの重ね表示
  if (overlaySet) {
    const done = new Set();
    sel.forEach(p => {
      for (let s = 1; s <= 6; s++) for (let f = p.win[0]; f <= p.win[1]; f++) {
        const key = s+'-'+f; if (done.has(key)) continue;
        if (p.notes.some(n => n.s === s && n.f === f)) continue;
        const info = noteAt(s, f, ROOT, overlaySet); if (!info.inScale) continue;
        done.add(key);
        const isChordTone = [0,4,7].includes(info.semi);
        const dg = el('g', {class:'dot'}, notesG);
        el('circle', {class:'base', cx:noteX(f), cy:strY(s), r:10, fill: isChordTone ? '#5B4636' : '#4A3428', stroke:'#CDBFAE', 'stroke-width':1, 'stroke-opacity':.6}, dg);
        const lab = state.label === 'degree' ? info.inScale.degree : state.label === 'doremi' ? info.inScale.doremi : info.inScale.name;
        const t = el('text', {x:noteX(f), y:strY(s)+3.5, 'text-anchor':'middle', 'font-size': lab.length > 2 ? 8 : 9.5, fill:'#E9E2D2', 'pointer-events':'none'}, dg);
        t.textContent = lab;
        dg.addEventListener('click', () => { ensureAudio(); pluck(info.midi, audio.ctx.currentTime + 0.01); cagedFlash([{s,f}]); });
      }
    });
  }
  // コードの形
  sel.forEach(p => {
    const c = CAGED_SHAPES[p.shape].color;
    p.notes.forEach(n => {
      const info = noteAt(n.s, n.f, ROOT, major);
      const dg = el('g', {class:'dot', tabindex:0, role:'button', 'aria-label':`${p.shape}形 ${n.s}弦${n.f}フレット ${n.role}`}, notesG);
      const isR = n.role === 'R';
      el('circle', {class:'base', cx:noteX(n.f), cy:strY(n.s), r:13, fill: isR ? 'var(--root)' : c, stroke: isR ? c : 'none', 'stroke-width':3}, dg);
      const lab = cagedLabel(info, n.role === 'R' ? 'R' : n.role);
      const t = el('text', {x:noteX(n.f), y:strY(n.s)+4, 'text-anchor':'middle', 'font-size': lab.length > 2 ? 9.5 : 11.5, 'font-weight':700, fill:'#22160F', 'pointer-events':'none'}, dg);
      t.textContent = lab;
      const act = () => { ensureAudio(); pluck(n.midi, audio.ctx.currentTime + 0.01); cagedFlash([n]); };
      dg.addEventListener('click', act);
      dg.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
    });
  });
  cagedMark = el('g', {}, svg);
}

function renderCaged(){
  const p = $('#panel-caged'); if (!p) return;
  p.innerHTML = '';
  const placements = cagedPlacements(ROOT);
  const firstCycle = [];
  placements.forEach(pl => { if (!firstCycle.some(x => x.shape === pl.shape)) firstCycle.push(pl); });
  const major = buildScale(ROOT, 'major');
  const tones = major.filter(n => [1,3,5].includes(n.deg)).map(n => n.name).join('・');

  const intro = document.createElement('article'); intro.className = 'card';
  intro.innerHTML = `<div class="eyebrow">CAGEDシステム</div><h2>${esc(ROOT.name)} メジャーコードの5つの形</h2>
    <p style="max-width:72ch;margin:6px 0 10px">オープンコードの <b>C・A・G・E・D</b> の5つの形を、そのまま指板上でずらして使う考え方です。同じ ${esc(ROOT.name)} コード（${esc(tones)}）が指板上の5か所に現れ、形は必ず <b>C→A→G→E→D→C…</b> の順に並びます。隣り合う形は音を共有してつながるので、5つを覚えると指板全体をコードの形で見渡せます。</p>
    <div class="caged-order">${firstCycle.map(pl => `<span style="--c:${CAGED_SHAPES[pl.shape].color}"><b>${pl.shape}形</b><small>${pl.lo}〜${pl.hi}F</small></span>`).join('<i>→</i>')}</div>
    <p class="muted small" style="margin-top:8px">キーは上の「キー（ルート）」で変更できます。スケールの選択とは関係なく、選んだルートのメジャーコードで表示します。</p>`;
  p.appendChild(intro);

  const ctl = document.createElement('article'); ctl.className = 'card';
  const shapes = ['all', ...CAGED_ORDER];
  ctl.innerHTML = `<div class="caged-ctl">
      <div class="ctl"><span>表示する形</span><div class="seg" id="cgShape">${shapes.map(s => `<button data-v="${s}" aria-pressed="${state.cagedShape===s}">${s==='all'?'全部':s+'形'}</button>`).join('')}</div></div>
      <div class="ctl"><span>重ねるスケール</span><div class="seg" id="cgOv">
        <button data-v="none" aria-pressed="${state.cagedOverlay==='none'}">なし</button>
        <button data-v="pent" aria-pressed="${state.cagedOverlay==='pent'}">メジャーペンタ</button>
        <button data-v="major" aria-pressed="${state.cagedOverlay==='major'}">メジャースケール</button></div></div>
      <div class="btns" style="align-self:flex-end"><button class="btn play" id="cgStrum" data-on="0">▶ 形を順に鳴らす</button></div>
    </div>
    <div class="board-card" style="margin-top:12px"><div class="board-scroll"><svg id="cgBoard" viewBox="0 0 1180 252" role="img" aria-label="CAGEDの形を表示した指板"></svg></div>
      <div class="board-foot"><div class="legend"><span><i style="background:var(--root)"></i>ルート（R）</span>
        ${CAGED_ORDER.map(k => `<span><i style="background:${CAGED_SHAPES[k].color}"></i>${k}形</span>`).join('')}
        <span><i style="background:#4A3428;box-shadow:inset 0 0 0 1px #CDBFAE"></i>重ねたスケール音</span></div>
        <div class="muted">表示ラベルは上の「音名／度数／ドレミ」に連動</div></div></div>`;
  p.appendChild(ctl);
  renderCagedBoard($('#cgBoard'), placements);
  ctl.querySelectorAll('#cgShape button').forEach(b => b.addEventListener('click', () => { state.cagedShape = b.dataset.v; save(); stopAll(); renderCaged(); }));
  ctl.querySelectorAll('#cgOv button').forEach(b => b.addEventListener('click', () => { state.cagedOverlay = b.dataset.v; save(); renderCaged(); }));
  const sb = $('#cgStrum');
  sb.addEventListener('click', () => {
    const list = state.cagedShape === 'all' ? firstCycle : placements.filter(x => x.shape === state.cagedShape).slice(0,1);
    stopAll(); ensureAudio();
    list.forEach((pl, i) => audio.timers.push(setTimeout(() => strum(pl), i * 900)));
  });

  // 形ごとの一覧
  const tbl = document.createElement('article'); tbl.className = 'card';
  tbl.innerHTML = `<div class="eyebrow">5つの形の早見表</div><h3 style="margin-bottom:8px">${esc(ROOT.name)} の場合</h3>
    <div class="tbl"><table><thead><tr><th>形</th><th>押さえる範囲</th><th>ルートがある弦</th><th>構成音の並び（6弦→1弦）</th><th></th></tr></thead><tbody>
    ${placements.map((pl, i) => `<tr><td><span class="sdot" style="background:${CAGED_SHAPES[pl.shape].color}"></span><b>${pl.shape}形</b></td>
      <td class="mono">${pl.lo}〜${pl.hi}F</td><td>${CAGED_SHAPES[pl.shape].roots}</td>
      <td class="mono">${[6,5,4,3,2,1].map(s => { const n = pl.notes.find(x => x.s === s); return n ? `${n.f}(${n.role})` : '×'; }).join(' ')}</td>
      <td><button class="btn small" data-i="${i}">▶</button></td></tr>`).join('')}
    </tbody></table></div>
    <p class="muted small" style="margin-top:8px">×の弦は弾かないか、ミュートします。E形とA形はバレーコードとしてそのまま使われることが多く、C形・G形・D形は全弦を押さえにくいため、一部の弦だけ（3〜4本のトライアド）で使うのが一般的です。</p>`;
  p.appendChild(tbl);
  tbl.querySelectorAll('button[data-i]').forEach(b => b.addEventListener('click', () => strum(placements[+b.dataset.i])));

  // 形ごとの練習
  const target = state.cagedShape === 'all' ? null : placements.find(x => x.shape === state.cagedShape);
  if (!target) {
    const c = document.createElement('article'); c.className = 'card';
    c.innerHTML = '<p>上の「表示する形」で C〜D のどれかを選ぶと、その形のアルペジオとスケールの練習TABがここに表示されます。</p>';
    p.appendChild(c);
  } else {
    const arp = cagedSeq(target.win, CHORD_TONES);
    const arpNotes = arp.concat(arp.slice(0,-1).reverse()).map((n,i,a) => ({...n, d: i===a.length-1 ? 8 : 2}));
    tabCard(p, { title:`${target.shape}形のアルペジオ（${target.win[0]}〜${target.win[1]}F）`,
      desc:`${target.shape}形の周辺にあるコード構成音（R・3・5）を低い音から高い音へ、そして戻ります。形の中でルートと3度の位置を確認しながら弾いてください。`,
      notes:arpNotes, key:'cg-arp', barUnit:16 });
    const scKey = state.cagedOverlay === 'major' ? 'major' : 'majorPent';
    const sq = cagedSeq(target.win, buildScale(ROOT, scKey));
    const scNotes = sq.concat(sq.slice(0,-1).reverse()).map((n,i,a) => ({...n, d: i===a.length-1 ? 8 : 2}));
    tabCard(p, { title:`${target.shape}形の${SCALES[scKey].name}（${target.win[0]}〜${target.win[1]}F）`,
      desc:`同じ範囲で${SCALES[scKey].name}を上下します。コードの形が「スケールの骨組み」になっていることを意識すると、ソロ中にコードトーンを狙いやすくなります。範囲は形の前後1フレットを含めた目安です。`,
      notes:scNotes, key:'cg-sc', barUnit:16 });
  }

  // 解説
  const lessons = document.createElement('div'); lessons.className = 'panel';
  lessons.innerHTML = `
  <details open><summary>CAGEDの基本ルール</summary><div>
    <p>1. 5つの形は、オープンコードの C・A・G・E・D の押さえ方が元になっています。</p>
    <p>2. 形を指板上で上に（ヘッドから遠い方へ）並べると、どのキーでも C→A→G→E→D の順番になり、Dの次はまたCに戻ります（1オクターブ＝12フレットで一周）。</p>
    <p>3. 隣り合う形は一部の音（多くはルートの位置）を共有していて、1つの形の右端が次の形の左端と重なります。</p>
    <p>4. ルートの弦で形を見分けます：C形・A形は5弦ルート、G形・E形は6弦ルート、D形は4弦ルート。</p>
    <div data-fig="cg-boxes"></div><div data-fig="cg-strip"></div>
  </div></details>
  <details><summary>練習のすすめ方（一例）</summary><div>
    <p>1. まず E形と A形（バレーコードとして使われる2つ）で、ルートの位置を指板上で確認します。</p>
    <p>2. 1つのキーで、5つの形を低いフレットから順に鳴らして（「形を順に鳴らす」ボタン）、つながり方を目と耳で覚えます。</p>
    <p>3. 形ごとにアルペジオ（R・3・5）を弾き、次にメジャーペンタ、メジャースケールの順で音を増やします。</p>
    <p>4. キーを変えて同じことを行います。形の順番は変わらず、始まる位置だけがずれることを確認します。</p>
    <div data-fig="cg-barre"></div>
    <p class="callout">練習方法は人によって合う・合わないがあります。ここでは一般的によく紹介される流れを、一例として載せています。</p>
  </div></details>
  <details><summary>マイナーキーで使うには</summary><div>
    <p>マイナーコードにも同じ5つの考え方（Am形・Em形・Dm形など）がありますが、本アプリではメジャーコードの形を表示しています。</p>
    <p>マイナーキーで使う簡単な方法は、平行調のメジャーの形を使うことです。たとえば A マイナーペンタは C メジャーペンタと同じ音なので、キーを C にして「メジャーペンタ」を重ねれば、その5つの領域がそのまま A マイナーペンタの5つのポジションになります（中心となる音が A に変わるだけです）。</p>
    <div data-fig="cg-minor"></div>
  </div></details>`;
  p.appendChild(lessons);
  fillCagedFigs(p, placements);
}

RH.bpm = state.tempo; $('#toptempo').innerHTML = tempoWidget(); renderMetro();
setupControls(); syncSeg(); syncTabs(); update(); renderQuiz(); renderRhythm(); renderEar(); renderMenu(); setBPM(state.tempo, null);
$('#dministop').addEventListener('click', () => dStop());
</script>
